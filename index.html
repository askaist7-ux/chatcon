<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스킬마켓 | 잠시 공사중입니다</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <main class="stage">
    <section class="copy">
      <img class="badge" src="mainImg.png" alt="스킬마켓 로고">
      <p class="eyebrow">SKILL MARKET · UNDER CONSTRUCTION</p>
      <h1>
        <span class="line">스킬마켓 사이트 변환을 위해</span>
        <span class="line accent">잠시 공사중입니다</span>
      </h1>
      <div class="rule"><i></i></div>
      <p class="sign">- 장안선 교수 드림 -</p>
    </section>

    <section class="portrait" aria-label="장안선 교수">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <img src="anseon.png" alt="장안선 교수">
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
